<!DOCTYPE html>
<html>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Montserrat', sans-serif;
        font-size: 20pt;
        color: lightblue;
        text-align: center;
    }
</style>

<body>
    <script type="module">
        import { onCleanup, createSignal, createResource } from "https://esm.sh/solid-js@1.8.1";
        import { render } from "https://esm.sh/solid-js@1.8.1/web";
        import html from "https://esm.sh/solid-js@1.8.1/html";
        const Plates = () => {
            const [plates, setPlates] = createSignal([])
            var source = new EventSource("http://192.168.56.10:5000/camera1/camera1sse");
            source.onmessage = function (event) {
                const alprdData = JSON.parse(event.data)
                setPlates(alprdData)
            };
            return html`
            <h1>
                ${plates}
            </h1>
    `;
        };
        //render(Plates, document.body);
        render(Plates, document.body);
    </script>
</body>

</html>

<div class="container" id="custom-cards">
    <h1>ALPR From Video</h1>
    <div class="container">
        <div class="card card-cover h-100 overflow-hidden text-white bg-dark rounded-1 shadow-lg">
            <div class="d-flex flex-column h-100 p-0 pb-0 text-white text-shadow-1">
                <h2>Upload Video File</h2>
                <form action="{{url_for('upload_video.upload_video_file')}}" method="POST"
                    enctype="multipart/form-data">
                    <input type="file" accept="video/*" id="video-files" name="file" />
                    <input onclick="update();" type="submit" />
                </form>
                <div id="Video_Progress_Status">
                    <div id="videoprogressBar"></div>
                </div>
            </div>
        </div>
    </div>
